[files]
exclude = [
	"**/__test__/fixtures/**",
	"**/__test__/*/fixtures/**",
	"**/__fixtures__/**",
	"**/node_modules/**",
	"**/.git/**",
	"**/.vscode/**",
	"schemas/config/test/**",
	"schemas/config/negative_test/**",
]

[format]
rules = {
	indent-style = "tab",
	indent-sub-tables = false,
	indent-table-key-value-pairs = false,
	indent-width = 2,
	line-width = 120,
}
