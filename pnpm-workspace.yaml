allowBuilds:
  "@vscode/vsce-sign": false
  keytar: false
autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.26.0
  "@savvy-web/pnpm-plugin-silk": 0.53.0
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
  - "@rspack/binding*"
  - "@rspack/core"
nodeOptions: --import=tsx
packages:
  - packages/*
  - plugin
  - scratchpad
  - vscode
  - website
permissions:
  tsdown:
    skills: true
skills:
  dirs:
    - .claude/skills
