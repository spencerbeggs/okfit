[lint]
# Keeps every git call out of the tests: run() skips the whole provenance
# tier when this is off, so Git.layerTest/GitHistory.layerTest can die-by-default.
generated_at_drift = "off"
# software-project turns status-missing on; off keeps the fixture diagnostic-free,
# so a server test sees only the diagnostics its own edit causes.
status_missing = "off"
