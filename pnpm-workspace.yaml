packages:
  - packages/*
  - plugins/*
  - scratchpad
  - vscode
  - website
allowBuilds:
  "@vscode/vsce-sign": false
  keytar: false
autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effect": 0.12.8
  "@savvy-web/pnpm-plugin-silk": 0.45.0
overrides:
  "@effected/cli": file:../effected/packages/cli/dist/prod/npm/pkg
  "@effected/env": file:../effected/packages/env/dist/prod/npm/pkg
  "@effected/github-commands": file:../effected/packages/github-commands/dist/prod/npm/pkg
