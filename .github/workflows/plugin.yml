name: Plugin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/claude-code/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/mcp/**"
      - "packages/profiles/**"
      - "okf/**"
      - ".config/okfit.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/plugin.yml"
  push:
    branches: [main]
    paths:
      - "plugins/claude-code/**"
      - "packages/mcp/**"
      - "okf/**"
      - ".config/okfit.toml"

concurrency:
  group: plugin-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plugin:
    name: BATS, markdownlint, and okfit validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup runtime
        uses: savvy-web/silk-runtime-action@v1

      # Important 2 (final-review fix wave): builds the real CLI so the one
      # OKFIT_BIN-gated smoke test in post-tool-use-validate.bats runs
      # against a real okfit binary in CI instead of skipping. okfit.js
      # already carries a #!/usr/bin/env node shebang and its executable
      # bit (dist/dev's own build output), so no wrapper script is needed.
      - name: Build the CLI for the OKFIT_BIN smoke test
        run: pnpm --filter @okfit/cli... build:dev

      - name: Run plugin BATS suite
        run: pnpm test:bats
        env:
          OKFIT_BIN: ${{ github.workspace }}/packages/cli/dist/dev/pkg/bin/okfit.js

      - name: Validate the okf bundle
        run: pnpm exec okfit validate . --format human

      - name: Guard the index against drift
        run: |
          pnpm exec okfit sync --dry-run --only index --format json \
            | jq -e '.index.written | length == 0'

      - name: Run the dogfood index guard
        run: pnpm vitest run packages/cli/__test__/e2e/dogfood.e2e.test.ts

      - name: Lint markdown
        run: pnpm lint:md
