#:schema https://raw.githubusercontent.com/spencerbeggs/okfit/main/schemas/1.0/config.json

[bundle]
path = "okf"
profile = "software-project"

[actors]
agent = "okfit/claude-code"
humans = ["human:spencer"]

[lint]
# A new concept-holding directory with no index.md must fail CI, not warn.
missing_index = "error"
# The bundle's existing human verifications predate integrity bindings; re-enable
# once `okfit verify` has bound them (verification-integrity phase 1).
verified_drift = "off"
