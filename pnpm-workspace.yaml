allowBuilds:
  "@vscode/vsce-sign": false
  keytar: false
autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.27.4
  "@savvy-web/pnpm-plugin-silk": 0.55.0
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
  - "@pnpm/exe.android-arm64@12.23.0"
  - "@pnpm/exe.android-x64@12.23.0"
  - "@pnpm/exe.darwin-arm64@12.23.0"
  - "@pnpm/exe.darwin-x64@12.23.0"
  - "@pnpm/exe.freebsd-x64@12.23.0"
  - "@pnpm/exe.linux-arm64-musl@12.23.0"
  - "@pnpm/exe.linux-arm64@12.23.0"
  - "@pnpm/exe.linux-loong64@12.23.0"
  - "@pnpm/exe.linux-ppc64@12.23.0"
  - "@pnpm/exe.linux-riscv64@12.23.0"
  - "@pnpm/exe.linux-s390x@12.23.0"
  - "@pnpm/exe.linux-x64-musl@12.23.0"
  - "@pnpm/exe.linux-x64@12.23.0"
  - "@pnpm/exe.netbsd-x64@12.23.0"
  - "@pnpm/exe.win32-arm64@12.23.0"
  - "@pnpm/exe.win32-x64@12.23.0"
  - pnpm@12.23.0
nodeOptions: --import=tsx
packages:
  - packages/*
  - plugin
  - scratchpad
  - vscode
  - website
permissions:
  tsdown:
    skills: true
skills:
  dirs:
    - .claude/skills
